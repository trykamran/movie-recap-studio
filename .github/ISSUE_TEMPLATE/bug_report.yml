name: Bug report
description: Report an incorrect or inconsistent skill behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: host
    attributes:
      label: Agent host and version
      placeholder: Codex CLI, Claude Code, ChatGPT desktop, etc.
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Minimal prompt and observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
